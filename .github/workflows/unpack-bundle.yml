name: unpack-bundle

on:
  push:
    paths: ["bundle.zip"]
  workflow_dispatch:

concurrency:
  group: unpack-bundle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip bundle into repo root
        run: |
          if [ ! -f bundle.zip ]; then
            echo "No bundle.zip found - nothing to unpack."
            exit 0
          fi
          unzip -o bundle.zip -d .
          rm bundle.zip
      - name: Commit and push unpacked files
        run: |
          git config user.name "unpack-bot"
          git config user.email "unpack-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Unpack bundle.zip"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push after 5 attempts."
          exit 1
